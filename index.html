<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    input, button {
      padding: 10px;
      margin-right: 10px;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      padding: 5px 0;
    }
  </style>
</head>
<body>
  <h1>La mia To-Do List</h1>
  <input type="text" id="attivita" placeholder="Inserisci una nuova attività">
  <button id="aggiungi">Aggiungi attività</button>
  <ul id="lista"></ul>

  <script>
    document.getElementById('aggiungi').addEventListener('click', function() {
      var testoAttivita = document.getElementById('attivita').value;
      if (testoAttivita.trim() !== '') {
        var nuovoElemento = document.createElement('li');
        nuovoElemento.textContent = testoAttivita;
        document.getElementById('lista').appendChild(nuovoElemento);
        document.getElementById('attivita').value = '';
      }
    });
  </script>
</body>
</html>
