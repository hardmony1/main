<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Schedule Planner</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <svg style="filter: brightness(2) invert(0.2);" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-grid" viewBox="0 0 16 16">
                <path d="M1 2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2zm6 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V2zm5-1a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1h-2zM2 9a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2zm6-1a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H8zm5-1a1 1 0 0 1-1 1v2a1 1 0 0 1 1 1h2a1 1 0 0 1 1-1V9a1 1 0 0 1-1-1h-2zM2 14a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2zm6-1a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H8zm5-1a1 1 0 0 1-1 1v2a1 1 0 0 1 1 1h2a1 1 0 0 1 1-1v-2a1 1 0 0 1-1-1h-2z"/>
            </svg>
            <h1 id="title">Daily Schedule Planner</h1>
        </div>
        <div class="navbar-right">
            <select id="language" onchange="changeLanguage()">
                <option value="en">🇬🇧 English</option>
                <option value="pt">🇵🇹 Português</option>
            </select>
        </div>
    </nav>
    <!-- Rest of the page remains unchanged -->

    <script>
        const translations = {
            en: {
                title: "Daily Schedule Planner",
                newSchedule: "New Schedule",
                savedSchedules: "Saved Schedules",
                language: "Language"
            },
            pt: {
                title: "Planeador de Horário Diário",
                newSchedule: "Novo Horário",
                savedSchedules: "Horários Guardados",
                language: "Idioma"
            }
        };

        function changeLanguage() {
            const lang = document.getElementById("language").value;
            const t = translations[lang];
            document.getElementById("title").textContent = t.title;
            document.querySelector('label[for="language"]').textContent = t.language;
            // Aggiorna altri testi se necessario
        }

        window.onload = () => {
            changeLanguage();
        };
    </script>
</body>
</html>
