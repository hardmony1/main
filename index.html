<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Schedule Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        .language-select {
            margin-top: 10px;
            text-align: center;
        }
        .language-select select {
            font-size: 16px;
            padding: 5px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .day {
            background-color: white;
            border: 1px solid #ccc;
            border-color: #dcdcdc;
            margin: 10px;
            padding: 15px;
            width: 250px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            border-radius: 5px;
        }
        .day h2 {
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="title">Daily Schedule Planner</h1>
    </header>
    <div class="language-select">
        <label for="language">🌐 <span id="language-label">Language</span>:</label>
        <select id="language" onchange="changeLanguage()">
            <option value="en">🇬🇧 English</option>
            <option value="pt">🇵🇹 Português</option>
        </select>
    </div>
    <div class="container">
        <div class="day">
            <h2 id="monday-title">Monday</h2>
            <textarea id="monday-text"></textarea>
        </div>
        <div class="day">
            <h2 id="tuesday-title">Tuesday</h2>
            <textarea id="tuesday-text"></textarea>
        </div>
        <div class="day">
            <h2 id="wednesday-title">Wednesday</h2>
            <textarea id="wednesday-text"></textarea>
        </div>
        <div class="day">
            <h2 id="thursday-title">Thursday</h2>
            <textarea id="thursday-text"></textarea>
        </div>
        <div class="day">
            <h2 id="friday-title">Friday</h2>
            <textarea id="friday-text"></textarea>
        </div>
        <div class="day">
            <h2 id="saturday-title">Saturday</h2>
            <textarea id="saturday-text"></textarea>
        </div>
        <div class="day">
            <h2 id="sunday-title">Sunday</h2>
            <textarea id="sunday-text"></textarea>
        </div>
    </div>
    <script>
        const translations = {
            en: {
                title: "Daily Schedule Planner",
                languageLabel: "Language",
                monday: "Monday",
                tuesday: "Tuesday",
                wednesday: "Wednesday",
                thursday: "Thursday",
                friday: "Friday",
                saturday: "Saturday",
                sunday: "Sunday"
            },
            pt: {
                title: "Planeador de Horário Diário",
                languageLabel: "Idioma",
                monday: "Segunda-feira",
                tuesday: "Terça-feira",
                wednesday: "Quarta-feira",
                thursday: "Quinta-feira",
                friday: "Sexta-feira",
                saturday: "Sábado",
                sunday: "Domingo"
            }
        };

        function changeLanguage() {
            const lang = document.getElementById("language").value;
            const t = translations[lang];
            document.getElementById("title").textContent = t.title;
            document.getElementById("language-label").textContent = t.languageLabel;
            document.getElementById("monday-title").textContent = t.monday;
            document.getElementById("tuesday-title").textContent = t.tuesday;
            document.getElementById("wednesday-title").textContent = t.wednesday;
            document.getElementById("thursday-title").textContent = t.thursday;
            document.getElementById("friday-title").textContent = t.friday;
            document.getElementById("saturday-title").textContent = t.saturday;
            document.getElementById("sunday-title").textContent = t.sunday;
        }

        // Set default language on load
        window.onload = () => {
            changeLanguage();
        };
    </script>
</body>
</html>
