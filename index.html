    <!-- Task Manager Section -->
    <div id="task-manager-section" class="d-none">
      <div class="row justify-content-center">

          <div class="card animate-fade-in">
            <div class="card-header">

            <div class="card-body">
              <div class="task-form">
                <input type="text" class="form-control" id="task-input" placeholder="Enter a new task">
                <select class="form-select me-2 w-auto" id="task-priority">
                  <option value="low">Low Priority</option>
                  <option value="medium" selected>Medium Priority</option>

                <button class="btn btn-primary" id="add-task">
                  <i class="fas fa-plus me-1"></i> <span id="add-task-text">Add Task</span>
                </button>
              </div>
              
              <div id="task-list">
                <!-- [Placeholder per i task esistenti] -->
                <div id="no-tasks" class="text-center py-4">
                  <i class="fas fa-tasks fa-3x mb-3 text-muted"></i>
                  <h5 id="no-tasks-text">No tasks yet</h5>
                  <p id="add-first-task-text">Add your first task above.</p>

  <script>
    // [Inizio del codice invariato relativo a traduzioni, funzioni helper, ecc.]
    const TRANSLATIONS = {

    const getTranslation = (key, lang) => {
      if (TRANSLATIONS[lang] && TRANSLATIONS[lang][key] !== undefined) {
        return TRANSLATIONS[lang][key];
      }
      return TRANSLATIONS["en"][key] || key;
    };

    // Funzioni per il parsing e l'analisi degli orari, etc.
    function parseTime(timeStr) { /* ... */ }
    function timeToStr(hour, minute) { /* ... */ }
    function analyzeSchedule(activities, workShift, lang = 'en') { /* ... */ }
    function getScheduleAdvice(activities, workShift, lang = 'en') { /* ... */ }

    // Global state
    let currentLanguage = 'en';
    const savedSchedules = [];
    const savedTasks = [];

    // INIZIALIZZAZIONE DELL'APPLICAZIONE AL CARICAMENTO DEL DOM
    document.addEventListener('DOMContentLoaded', function() {
      // Set default language, setup language switcher, navigation, etc.
      // [Codice invariato per le impostazioni iniziali]

      // Setup add activity button
      document.getElementById('add-activity').addEventListener('click', function() {
        addActivityRow();
      });
      
      // Setup form submission
      document.getElementById('schedule-form').addEventListener('submit', function(event) {
        saveSchedule(event);
      });
      
      // Setup task manager: aggiunta task tramite click
      document.getElementById('add-task').addEventListener('click', function() {
        addTask();
      });
      
      // Abilita anche il tasto "Enter" per l'input task
      document.getElementById('task-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          addTask();
        }
      });
      
      // [Resto del codice per l'inizializzazione, caricamento dati, ecc.]
    });

    // -------------------------------------------------------------------------------------
    // AGGIUNTA DELLA FUNZIONE addTask() - MODIFICA NECESSARIA PER RISOLVERE IL BUG
    // -------------------------------------------------------------------------------------
    function addTask() {
      const taskInput = document.getElementById('task-input');
      const taskText = taskInput.value.trim();
      
      if (taskText === "") {
        alert(getTranslation('task_empty', currentLanguage));
        return;
      }
      
      const taskList = document.getElementById('task-list');
      
      // Rimuovi il placeholder "No tasks" se presente
      const noTasksElem = document.getElementById('no-tasks');
      if (noTasksElem) {
        noTasksElem.remove();
      }
      
      // Crea il nuovo elemento task
      const taskItem = document.createElement('div');
      taskItem.className = 'task-item';
      taskItem.innerHTML = `
        <span class="task-text">${taskText}</span>
        <div class="task-actions">
          <button class="btn btn-success btn-sm mark-complete">${getTranslation('mark_complete', currentLanguage)}</button>
          <button class="btn btn-danger btn-sm delete-task">${getTranslation('delete_task', currentLanguage)}</button>
        </div>
      `;
      
      taskList.appendChild(taskItem);
      taskInput.value = ""; // Pulisce l'input dopo l'aggiunta
      
      // Aggiunge l'event listener per il pulsante "Elimina task"
      taskItem.querySelector('.delete-task').addEventListener('click', function () {
        taskItem.remove();
        // Se dopo la rimozione non ci sono task, reinserisci il placeholder
        if (taskList.childElementCount === 0) {
          const placeholder = document.createElement('div');
          placeholder.id = "no-tasks";
          placeholder.className = 'text-center py-4';
          placeholder.innerHTML = `
            <i class="fas fa-tasks fa-3x mb-3 text-muted"></i>
            <h5 id="no-tasks-text">${getTranslation('no_tasks', currentLanguage)}</h5>
            <p id="add-first-task-text">${getTranslation('add_first_task', currentLanguage)}</p>
          `;
          taskList.appendChild(placeholder);
        }
      });
      
      // Aggiunge l'event listener per il pulsante "Segna come completata/incompleta"
      taskItem.querySelector('.mark-complete').addEventListener('click', function () {
        taskItem.classList.toggle('completed');
        const btn = this;
        if (taskItem.classList.contains('completed')) {
          btn.textContent = getTranslation('mark_incomplete', currentLanguage);
        } else {
          btn.textContent = getTranslation('mark_complete', currentLanguage);
        }
      });
    }
    // -------------------------------------------------------------------------------------
    // FINE DELLA MODIFICA PER addTask()
    // -------------------------------------------------------------------------------------
    
    // [Il resto delle funzioni, ad esempio addActivityRow(), saveSchedule(), validateForm() etc. rimangono invariati]
    function addActivityRow() { /* ... codice invariato ... */ }

    function validateForm() { /* ... codice invariato ... */ }
