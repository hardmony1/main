/* Card styling */
.card {
    background-color: var(--bs-gray-800);
    border: none;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    border-radius: 10px;
}

.card-header {
    background-color: rgba(0, 0, 0, 0.2);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    padding: 1.25rem;
}

.card-body {
    padding: 1.5rem;
}

.text-gradient {
    background: linear-gradient(90deg, var(--bs-info), var(--bs-primary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-fill-color: transparent;
}

/* Rounded extra large */
.rounded-xl {
    border-radius: 1rem;
}

/* Fade in animation */
.animate-fade-in {
    animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Main content padding */
.main-content {
    padding-top: 2rem;
    padding-bottom: 2rem;
}

/* Form controls */
.form-control, .form-select {
    background-color: var(--bs-gray-700);
    border: 1px solid var(--bs-gray-600);
    color: var(--bs-light);
    transition: all 0.3s;
}

.form-control:focus, .form-select:focus {
    background-color: var(--bs-gray-700);
    border-color: var(--bs-primary);
    color: var(--bs-light);
    box-shadow: 0 0 0 0.25rem rgba(var(--bs-primary-rgb), 0.25);
}

/* Button styling */
.btn {
    font-weight: 500;
    letter-spacing: 0.5px;
    padding: 0.5rem 1.25rem;
    transition: all 0.3s;
}

.btn-primary {
    background: linear-gradient(45deg, var(--bs-primary), var(--bs-info));
    border: none;
    box-shadow: 0 4px 8px rgba(var(--bs-primary-rgb), 0.3);
}

.btn-primary:hover {
    background: linear-gradient(45deg, var(--bs-info), var(--bs-primary));
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(var(--bs-primary-rgb), 0.4);
}

.btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 2px 4px rgba(var(--bs-primary-rgb), 0.3);
}

/* Schedule advice section */
#schedule-advice {
    background-color: rgba(var(--bs-info-rgb), 0.1);
    border-left: 4px solid var(--bs-info);
    padding: 1.25rem;
}

#schedule-advice ul {
    margin-top: 0.5rem;
}

#schedule-advice li {
    margin-bottom: 0.5rem;
}

/* Schedules list */
.schedule-list {
    margin-top: 2rem;
}

.schedule-item {
    border-radius: 10px;
    margin-bottom: 1.5rem;
    transition: transform 0.3s;
}

.schedule-item:hover {
    transform: translateY(-5px);
}

/* Media queries */
@media (max-width: 768px) {
    .card-header {
        padding: 1rem;
    }
    .card-body {
        padding: 1.25rem;
    }
}

// Helper functions
const getTranslation = (key, lang) => {
    if (TRANSLATIONS[lang] && TRANSLATIONS[lang][key] !== undefined) {
        return TRANSLATIONS[lang][key];
    }
    // Fallback to English
    return TRANSLATIONS["en"][key] || key;
};

function parseTime(timeStr) {
    // Handle different time formats
    timeStr = timeStr.replace("AM", "").replace("PM", "").replace("Uhr", "").trim();
    
    // Extract start and end times
    const match = timeStr.match(/(\d{1,2}):?(\d{2})?\s*-\s*(\d{1,2}):?(\d{2})?/);
    if (!match) {
        return [null, null, null, null];
    }
    
    // Extract hours and minutes
    const hourStart = parseInt(match[1]);
    const minuteStart = parseInt(match[2] || 0);
    let hourEnd = parseInt(match[3]);
    const minuteEnd = parseInt(match[4] || 0);
    
    // Adjust for PM times if format doesn't use 24-hour clock
    if (hourStart < hourEnd && hourEnd <= 12) {
        // Likely morning to afternoon format
        return [hourStart, minuteStart, hourEnd, minuteEnd];
    } else if (hourStart > hourEnd && hourEnd < 12) {
        // Likely afternoon to night format, so hour_end should be PM
        hourEnd += 12;
    }
    
    return [hourStart, minuteStart, hourEnd, minuteEnd];
}

function timeToStr(hour, minute) {
    return `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
}

function analyzeSchedule(activities, workShift, lang = 'en') {
    // Placeholder for advice
    const advice = [];
    
    // Parse work shift time
    const [workStartH, workStartM, workEndH, workEndM] = parseTime(workShift);
    
    // Sort activities by time
    const sortedActivities = [];
    for (const activity of activities) {
        const timeStr = activity.time;
        const activityName = activity.activity;
        if (timeStr && activityName) {
            const [startH, startM, endH, endM] = parseTime(timeStr);
            if (startH !== null && startM !== null && endH !== null && endM !== null) {
                sortedActivities.push({
                    name: activityName,
                    startH,
                    startM,
                    endH,
                    endM,
                    startTime: timeToStr(startH, startM),
                    endTime: timeToStr(endH, endM)
                });
            }
        }
    }
    
    // Sort by start time
    sortedActivities.sort((a, b) => (a.startH * 60 + a.startM) - (b.startH * 60 + b.startM));
    
    // If we have less than 3 activities, not enough data for advice
    if (sortedActivities.length < 3) {
        return ["no_advice"];
    }
    
    // Find sleep times
    const sleepActivity = sortedActivities.find(a => 
        a.name.includes("Sleep") || 
        a.name.includes("Dormire") || 
        a.name.includes("Schlafen") || 
        a.name.includes("Dormir")
    );
    
    if (!sleepActivity) {
        // Recommend 8 hours sleep before work
        if (workStartH !== null && workStartM !== null) {
            const sleepStartH = Math.max(0, workStartH - 9);  // 9 hours before work starts (includes prep time)
            const sleepEndH = Math.max(0, workStartH - 1);    // 1 hour before work starts
            advice.push({
                type: "sleep_advice",
                params: {
                    start_time: timeToStr(sleepStartH, 0), 
                    end_time: timeToStr(sleepEndH, 0)
                }
            });
        }
    }
    
    // Find meal times
    const breakfast = sortedActivities.find(a => 
        a.name.includes("Breakfast") || 
        a.name.includes("Colazione") || 
        a.name.includes("Frühstück") || 
        a.name.includes("Desayuno") || 
        a.name.includes("Café")
    );
    
    const lunch = sortedActivities.find(a => 
        a.name.includes("Lunch") || 
        a.name.includes("Pranzo") || 
        a.name.includes("Mittagessen") || 
        a.name.includes("Almuerzo") || 
        a.name.includes("Almoço")
    );
    
    const dinner = sortedActivities.find(a => 
        a.name.includes("Dinner") || 
        a.name.includes("Cena") || 
        a.name.includes("Abendessen") || 
        a.name.includes("Jantar")
    );
    
    // If at least one meal is missing, suggest meal times
    if (!(breakfast && lunch && dinner)) {
        // Default meal times
        let suggestedBreakfast = "07:30";
        let suggestedLunch = "12:30"; 
        let suggestedDinner = "19:00";
        
        // Adjust based on work schedule
        if (workStartH !== null && workEndH !== null) {
            suggestedBreakfast = timeToStr(Math.max(6, workStartH - 1), 30);
            // Calculate lunch time halfway between work start and end
            const lunchHour = Math.max(12, Math.floor((workStartH + workEndH) / 2));
            suggestedLunch = timeToStr(lunchHour, 0);
            // Calculate dinner time after work
            const dinnerHour = Math.min(21, workEndH + 1); 
            suggestedDinner = timeToStr(dinnerHour, 30);
        }
        
        // Override with actual times if available
        if (breakfast) {
            suggestedBreakfast = breakfast.startTime;
        }
        if (lunch) {
            suggestedLunch = lunch.startTime;
        }
        if (dinner) {
            suggestedDinner = dinner.startTime;
        }
            
        advice.push({
            type: "meal_advice",
            params: {
                breakfast: suggestedBreakfast,
                lunch: suggestedLunch, 
                dinner: suggestedDinner
            }
        });
    }
    
    // Find free time blocks
    const freeTimeBlocks = [];
    for (let i = 0; i < sortedActivities.length - 1; i++) {
        const currEndH = sortedActivities[i].endH;
        const currEndM = sortedActivities[i].endM;
        const nextStartH = sortedActivities[i+1].startH;
        const nextStartM = sortedActivities[i+1].startM;
        
        // Calculate time difference in minutes
        const currEndMinutes = currEndH * 60 + currEndM;
        const nextStartMinutes = nextStartH * 60 + nextStartM;
        
        // If there's at least 30 minutes of free time
        if (nextStartMinutes - currEndMinutes >= 30) {
            freeTimeBlocks.push({
                startH: currEndH,
                startM: currEndM,
                endH: nextStartH,
                endM: nextStartM,
                durationMinutes: nextStartMinutes - currEndMinutes
            });
        }
    }
    
    // Suggest activities for free time blocks
    const suggestedActivities = ["Exercise", "Reading", "Hobby", "Socializing", "Sport", "Ejercicio", "Lectura", "Pasatiempo"];
    
    if (freeTimeBlocks.length > 0) {
        // Find the longest free time block
        const longestBlock = freeTimeBlocks.reduce((max, block) => 
            block.durationMinutes > max.durationMinutes ? block : max, freeTimeBlocks[0]);
            
        if (longestBlock.durationMinutes >= 45) {
            advice.push({
                type: "free_time_advice",
                params: {
                    start_time: timeToStr(longestBlock.startH, longestBlock.startM),
                    end_time: timeToStr(longestBlock.endH, longestBlock.endM),
                    activity: suggestedActivities[Math.floor(Math.random() * suggestedActivities.length)]
                }
            });
        }
    }
    
    // Start with introduction
    const finalAdvice = [{type: "advice_intro"}];
    finalAdvice.push(...advice);
    
    return finalAdvice;
}

function getScheduleAdvice(activities, workShift, lang = 'en') {
    const advice = analyzeSchedule(activities, workShift, lang);
    const formattedAdvice = [];
    
    for (const item of advice) {
        if (typeof item === 'string') {
            // Simple translation key
            formattedAdvice.push(getTranslation(item, lang));
        } else {
            // Translation key with parameters
            const key = item.type;
            const params = item.params;
            const translationTemplate = getTranslation(key, lang);
            // Format the translation with parameters
            const formattedItem = translationTemplate.replace(/{([^}]+)}/g, (match, key) => params[key] || match);
            formattedAdvice.push(formattedItem);
        }
    }
    
    return formattedAdvice;
}

document.addEventListener('DOMContentLoaded', function() {
    // Set default language
    setLanguage(getCurrentLanguage());
    
    // Setup language switcher
    document.querySelectorAll('.language-option').forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();
            setLanguage(this.dataset.lang);
        });

    document.getElementById('nav-new').addEventListener('click', function(e) {

    document.getElementById('create-new-btn').addEventListener('click', function() {

function getCurrentLanguage() {
    // Try to get from localStorage
    const storedLang = localStorage.getItem('scheduleLanguage');
    if (storedLang && TRANSLATIONS[storedLang]) {
        return storedLang;
    }
    
    // Try to get from browser
    const browserLang = navigator.language.split('-')[0];
    if (TRANSLATIONS[browserLang]) {
        return browserLang;
    }
    
    // Default to English
    return 'en';
}

function setLanguage(lang) {
    if (!TRANSLATIONS[lang]) {
        lang = 'en'; // Fallback to English
    }
    
    currentLanguage = lang;
    localStorage.setItem('scheduleLanguage', lang);
    
    // Update page content
    document.getElementById('app-name').innerHTML = `<i class="fas fa-calendar-alt me-2"></i> <span class="text-gradient">${getTranslation('app_name', lang)}</span>`;
    document.getElementById('new-schedule').textContent = getTranslation('new_schedule', lang);
    document.getElementById('saved-schedules-nav').textContent = getTranslation('saved_schedules', lang);
    document.getElementById('create-schedule').textContent = getTranslation('create_schedule', lang);
    document.getElementById('work-shift-label').textContent = getTranslation('work_shift', lang);
    document.getElementById('work_shift').placeholder = getTranslation('work_shift_placeholder', lang);
    document.getElementById('select-activities').textContent = getTranslation('select_activities', lang);
    document.getElementById('add-activity-text').textContent = getTranslation('add_activity', lang);
    document.getElementById('save-schedule-btn').textContent = getTranslation('save_schedule', lang);
    document.getElementById('your-saved').textContent = getTranslation('your_saved', lang);
    document.getElementById('create-new').textContent = getTranslation('create_new', lang);
    document.getElementById('no-schedules-text').textContent = getTranslation('no_schedules', lang);
    document.getElementById('create-first').textContent = getTranslation('create_first', lang);
    document.getElementById('create-new-btn-text').textContent = getTranslation('create_new', lang);
    
    // Update placeholders
    document.querySelectorAll('.time-input').forEach(input => {
        input.placeholder = getTranslation('time_placeholder', lang);
    });
    
    document.querySelectorAll('.activity-select').forEach(select => {
        const firstOption = select.querySelector('option:first-child');
        if (firstOption) {
            firstOption.textContent = getTranslation('select_activity', lang);
        }
    });
    
    // Update activities in dropdowns
    updateActivityDropdowns();
    
    // Update saved schedules display
    updateSchedulesDisplay();
}

function updateActivityDropdowns() {
    const activities = getTranslation('activities', currentLanguage);
    const activitySelects = document.querySelectorAll('.activity-select');
    
    activitySelects.forEach(select => {
        // Save the currently selected value if there is one
        const currentValue = select.value;
        
        // Keep only the first option (placeholder)
        const placeholder = select.querySelector('option:first-child');
        select.innerHTML = '';
        if (placeholder) {
            select.appendChild(placeholder);
        }
        
        // Add all activities
        activities.forEach(activity => {
            const option = document.createElement('option');
            option.value = activity;
            option.textContent = activity;
            select.appendChild(option);
        });
        
        // Restore selected value if it was set
        if (currentValue) {
            select.value = currentValue;
        }
    });
}

function showSection(sectionId) {
    document.getElementById('new-schedule-section').classList.add('d-none');
    document.getElementById('saved-schedules-section').classList.add('d-none');
    
    document.getElementById(sectionId).classList.remove('d-none');
    
    // Update navigation active state
    document.getElementById('nav-new').classList.remove('active');
    document.getElementById('nav-saved').classList.remove('active');
    
    if (sectionId === 'new-schedule-section') {
        document.getElementById('nav-new').classList.add('active');
    } else {
        document.getElementById('nav-saved').classList.add('active');
    }
}

    const rowCount = container.querySelectorAll('.activity-entry').length;
    
    const newRow = document.createElement('div');
    newRow.className = 'activity-entry mb-3 row animate-fade-in';

            <select class="form-select activity-select" id="activity-select-${rowCount}">
                <option value="" selected disabled>${selectActivity}</option>

    container.appendChild(newRow);

    activities.forEach(activity => {

        option.value = activity;

    console.log('Added new activity row');

function saveSchedule(event) {
    event.preventDefault();
    
    // Reset previous messages
    document.getElementById('success-message').classList.add('d-none');
    document.getElementById('error-message').classList.add('d-none');
    
    // Remove any existing advice container
    const existingAdvice = document.getElementById('schedule-advice');
    if (existingAdvice) {
        existingAdvice.classList.add('d-none');
    }
    
    // Validate form
    if (!validateForm()) {
        document.getElementById('error-message').textContent = getTranslation('fill_required', currentLanguage);
        document.getElementById('error-message').classList.remove('d-none');
        return;
    }
    
    const workShift = document.getElementById('work_shift').value;
    const activities = [];
    
    // Get all filled activity rows
    const activityEntries = document.querySelectorAll('.activity-entry');
    activityEntries.forEach(entry => {
        const timeInput = entry.querySelector('.time-input').value;
        const activitySelect = entry.querySelector('.activity-select').value;
        
        if (timeInput && activitySelect) {
            activities.push({
                time: timeInput,
                activity: activitySelect
            });
        }
    });
    
    // Generate a unique ID for the schedule
    const scheduleId = Date.now().toString();
    
    // Create a new schedule object
    const schedule = {
        id: scheduleId,
        date: new Date().toLocaleDateString(),
        shift: workShift,
        activities: activities,
        language: currentLanguage
    };
    
    // Get advice for this schedule
    const advice = getScheduleAdvice(activities, workShift, currentLanguage);
    
    // Save to local storage
    saveScheduleToStorage(schedule);
    
    // Show success message
    document.getElementById('success-message').textContent = getTranslation('schedule_saved', currentLanguage);
    document.getElementById('success-message').classList.remove('d-none');
    
    // Show advice if available
    if (advice && advice.length > 0) {
        // Create or get advice container
        let adviceContainer = document.getElementById('schedule-advice');
        if (!adviceContainer) {
            adviceContainer = document.createElement('div');
            adviceContainer.id = 'schedule-advice';
            adviceContainer.className = 'alert alert-info mt-4 animate-fade-in';
            document.getElementById('success-message').after(adviceContainer);
        } else {
            adviceContainer.innerHTML = '';
            adviceContainer.classList.remove('d-none');
        }
        
        // Create advice content
        const adviceList = document.createElement('ul');
        adviceList.className = 'mb-0 ps-3';
        
        advice.forEach((item, index) => {
            if (index === 0) {
                // First item is the introduction
                const intro = document.createElement('p');
                intro.className = 'mb-2 fw-bold';
                intro.innerHTML = `<i class="fas fa-lightbulb text-warning me-2"></i>${item}`;
                adviceContainer.appendChild(intro);
            } else {
                // Other items are advice points
                const listItem = document.createElement('li');
                listItem.innerHTML = item;
                adviceList.appendChild(listItem);
            }
        });
        
        adviceContainer.appendChild(adviceList);
    }
    
    // Reset form after successful save (optional)
    setTimeout(() => {
        showSection('saved-schedules-section');
        loadSavedSchedules();
    }, 3000);
}

function validateForm() {
    let isValid = true;
    
    // Validate work shift
    const workShift = document.getElementById('work_shift');
    if (!workShift.value.trim()) {
        workShift.classList.add('is-invalid');
        isValid = false;
    } else {
        workShift.classList.remove('is-invalid');
    }
    
    // Validate at least one activity is entered
    let hasActivity = false;
    const activityEntries = document.querySelectorAll('.activity-entry');
    
    activityEntries.forEach(entry => {
        const timeInput = entry.querySelector('.time-input');
        const activitySelect = entry.querySelector('.activity-select');
        
        if (timeInput.value && activitySelect.value) {
            hasActivity = true;
        }
        
        // Validate required fields
        if (timeInput.required && !timeInput.value) {
            timeInput.classList.add('is-invalid');
            isValid = false;
        } else {
            timeInput.classList.remove('is-invalid');
        }
        
        if (activitySelect.required && !activitySelect.value) {
            activitySelect.classList.add('is-invalid');
            isValid = false;
        } else {
            activitySelect.classList.remove('is-invalid');
        }
    });
    
    if (!hasActivity) {
        // Mark the first row as required if no activities
        const firstEntry = activityEntries[0];
        if (firstEntry) {
            const timeInput = firstEntry.querySelector('.time-input');
            const activitySelect = firstEntry.querySelector('.activity-select');
            
            timeInput.required = true;
            activitySelect.required = true;
            
            timeInput.classList.add('is-invalid');
            activitySelect.classList.add('is-invalid');
        }
        isValid = false;
    }
    
    return isValid;
}

function saveScheduleToStorage(schedule) {
    // Get existing schedules from localStorage
    let schedules = [];
    try {
        const stored = localStorage.getItem('savedSchedules');
        if (stored) {
            schedules = JSON.parse(stored);
        }
    } catch (e) {
        console.error('Error loading schedules from storage:', e);
    }
    
    // Add the new schedule
    schedules.push(schedule);
    
    // Save back to localStorage
    try {
        localStorage.setItem('savedSchedules', JSON.stringify(schedules));
    } catch (e) {
        console.error('Error saving schedules to storage:', e);
    }
    
    // Update our local array
    savedSchedules.length = 0;
    savedSchedules.push(...schedules);
}

function loadSavedSchedules() {
    // Clear existing array
    savedSchedules.length = 0;
    
    // Load from localStorage
    try {
        const stored = localStorage.getItem('savedSchedules');
        if (stored) {
            const schedules = JSON.parse(stored);
            savedSchedules.push(...schedules);
        }
    } catch (e) {
        console.error('Error loading schedules from storage:', e);
    }
    
    // Update the display
    updateSchedulesDisplay();
}

function updateSchedulesDisplay() {
    const container = document.getElementById('schedules-container');
    const noSchedulesMessage = document.getElementById('no-schedules');
    
    // Show/hide no schedules message
    if (savedSchedules.length === 0) {
        noSchedulesMessage.classList.remove('d-none');
        container.innerHTML = '';
        return;
    }
    
    // Hide no schedules message and show schedules
    noSchedulesMessage.classList.add('d-none');
    
    // Clear container
    container.innerHTML = '';
    
    // Sort schedules by date (newest first)
    const sortedSchedules = [...savedSchedules].sort((a, b) => {
        return new Date(b.date) - new Date(a.date);
    });
    
    // Add each schedule
    sortedSchedules.forEach(schedule => {
        const scheduleItem = document.createElement('div');
        scheduleItem.className = 'card schedule-item animate-fade-in';
        scheduleItem.dataset.id = schedule.id;
        
        const formattedDate = new Date(schedule.date).toLocaleDateString(
            currentLanguage === 'en' ? 'en-US' : 
            currentLanguage === 'it' ? 'it-IT' : 
            currentLanguage === 'de' ? 'de-DE' : 
            currentLanguage === 'es' ? 'es-ES' : 
            currentLanguage === 'pt' ? 'pt-BR' : 'en-US'
        );
        
        scheduleItem.innerHTML = `
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">${getTranslation('schedule_for', currentLanguage)} ${formattedDate}</h5>
                <button class="btn btn-sm btn-outline-danger delete-schedule-btn" data-id="${schedule.id}">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            <div class="card-body">
                <p><strong>${getTranslation('work_shift_label', currentLanguage)}</strong> ${schedule.shift}</p>
                <div class="table-responsive">
                    <table class="table table-sm table-dark">
                        <thead>
                            <tr>
                                <th>${getTranslation('time_header', currentLanguage)}</th>
                                <th>${getTranslation('activity_header', currentLanguage)}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${schedule.activities.map(activity => `
                                <tr>
                                    <td>${activity.time}</td>
                                    <td>${activity.activity}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
        
        container.appendChild(scheduleItem);
        
        // Add event listener for delete button
        const deleteButton = scheduleItem.querySelector('.delete-schedule-btn');
        deleteButton.addEventListener('click', function() {
            deleteSchedule(this.dataset.id);
        });
    });
}

function deleteSchedule(scheduleId) {
    if (!confirm(getTranslation('delete_confirm', currentLanguage))) {
        return;
    }
    
    // Find the schedule index
    const index = savedSchedules.findIndex(s => s.id === scheduleId);
    if (index === -1) return;
    
    // Remove from array
    savedSchedules.splice(index, 1);
    
    // Update localStorage
    try {
        localStorage.setItem('savedSchedules', JSON.stringify(savedSchedules));
    } catch (e) {
        console.error('Error saving schedules to storage:', e);
    }
    
    // Update display
    updateSchedulesDisplay();
}
    </script>
